    <!-- MathJax 配置: 在 data: URL 中禁用 localStorage/speech 以避免控制台错误 -->
    <script>
      // localStorage 在 data: URL 中不可用, 提供安全的内存垫片
      try { localStorage.getItem('_test_'); }
      catch(e) {
        var _memStore = {};
        var _safeStorage = {
          getItem: function(k) { return _memStore[k] || null; },
          setItem: function(k, v) { _memStore[k] = String(v); },
          removeItem: function(k) { delete _memStore[k]; },
          clear: function() { _memStore = {}; },
          key: function(i) { return Object.keys(_memStore)[i] || null; },
          get length() { return Object.keys(_memStore).length; }
        };
        try {
          // 尝试直接覆盖 (部分环境支持)
          window.localStorage = _safeStorage;
        } catch(e2) {
          // 不行就用 Object.defineProperty (现代浏览器)
          try {
            Object.defineProperty(window, 'localStorage', {
              value: _safeStorage, writable: false, configurable: true
            });
          } catch(e3) {}
        }
      }
      // 配置 MathJax: 不加载 speech-rule 引擎 (避免 WebWorker + localStorage 错误)
      window.MathJax = {
        loader: { load: ['input/tex', 'output/svg'] },
        options: {
          enableMenu: false,
          sre: { speech: false, disabled: true }
        },
        tex: { packages: { '[+]': ['base'] } }
      };
    </script>
    <script src="http://assets.example/mathjax/tex-svg.js"></script>
  </head>
  <body>
    <div id="content"></div>
    
    <script>
      // ========================================================
      // 插件配置 (由 C++ MdProcessor 注入)
      // ========================================================
      var pluginConfig = __PLUGIN_CONFIG__;
      
      // ========================================================
      // 自定义渲染规则 (Mermaid 兼容)
      // ========================================================
      function setupCustomRules(md) {
          // 保留 Mermaid 代码块渲染
          var defaultFence = md.renderer.rules.fence.bind(md.renderer.rules);
          md.renderer.rules.fence = function(tokens, idx, options, env, self) {
              var token = tokens[idx];
              var info = token.info ? token.info.trim() : '';
              if (info === 'mermaid') {
                  return '<pre class="mermaid">' + escapeHtml(token.content) + '</pre>\n';
              }
              return defaultFence(tokens, idx, options, env, self);
          };
      }
      
      function escapeHtml(str) {
          return str
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;');
      }
      
      // ========================================================
      // 主渲染逻辑
      // ========================================================
      var url = "http://local.example/__MD_FILENAME__";
      
      fetch(url).then(function(r) { return r.arrayBuffer(); }).then(async function(t) {
          var decoder = new TextDecoder(detect_charset(new Uint8Array(t)));
          
          // 初始化 markdown-it
          var md = window.markdownit({
              html: true,
              linkify: true,
              typographer: true,
              breaks: false,
              highlight: function(str, lang) {
                  if (lang && hljs.getLanguage(lang)) {
                      try {
                          return '<pre class="hljs"><code>' +
                                 hljs.highlight(str, { language: lang, ignoreIllegals: true }).value +
                                 '</code></pre>';
                      } catch (__) {}
                  }
                  return '<pre class="hljs"><code>' + md.utils.escapeHtml(str) + '</code></pre>';
              }
          });
          
          // 设置自定义渲染规则
          setupCustomRules(md);
          
          // 通过注册表框架加载所有启用的插件
          var result = window.MditPluginRegistry.registerPlugins(md, pluginConfig);
          
          // 调试信息 (可在控制台查看)
          console.log('[mdit] Registered plugins:', result.registered);
          if (result.skipped.length) console.log('[mdit] Skipped plugins:', result.skipped);
          if (result.errors.length) console.error('[mdit] Plugin errors:', result.errors);
          
          // 移除 YAML frontmatter
          var rawContent = decoder.decode(t).replace(/^---\r?\n[\s\S]*?\n---\r?\n?/, '');
          
          // 渲染 Markdown
          document.getElementById('content').innerHTML = md.render(rawContent);
          
          // ---- MathJax (保留用于兼容, 特别是 tex-svg 模式) ----
          try {
              if (typeof MathJax !== 'undefined' && MathJax.typeset) {
                  MathJax.typeset();
              }
          } catch(e) {
              console.log("MathJax error:", e);
          }
          
          // ---- Mermaid (通过 uml 插件已处理, 此处为后备) ----
          try {
              if (typeof mermaid !== 'undefined') {
                  mermaid.initialize({ startOnLoad: false });
                  await mermaid.run();
              }
          } catch(e) {
              console.log("Mermaid error:", e);
          }
          
          // ---- highlight.js 后备处理 (处理未被 markdown-it 高亮的代码块) ----
          try {
              document.querySelectorAll('pre code:not(.hljs)').forEach(function(block) {
                  hljs.highlightElement(block);
              });
          } catch(e) {
              console.log("highlight.js error:", e);
          }
          
          // ---- Tab 标签页交互 ----
          try {
              setupTabInteraction();
          } catch(e) {
              console.log("Tab interaction error:", e);
          }
      });
      
      // ========================================================
      // Tab 标签页点击交互
      // ========================================================
      function setupTabInteraction() {
          document.querySelectorAll('.tabs-tabs-header').forEach(function(header) {
              header.addEventListener('click', function(e) {
                  var button = e.target.closest('.tabs-tab-button');
                  if (!button) return;
                  
                  var wrapper = button.closest('.tabs-tabs-wrapper');
                  if (!wrapper) return;
                  
                  var tabId = button.getAttribute('data-tab');
                  if (!tabId) return;
                  
                  // 更新按钮状态
                  wrapper.querySelectorAll('.tabs-tab-button').forEach(function(btn) {
                      btn.classList.remove('active');
                  });
                  button.classList.add('active');
                  
                  // 更新内容显示
                  wrapper.querySelectorAll('.tabs-tab-content').forEach(function(content) {
                      content.classList.remove('active');
                  });
                  var targetContent = wrapper.querySelector('[data-index="' + tabId + '"]');
                  if (targetContent) targetContent.classList.add('active');
              });
          });
          
          // 激活第一个标签
          document.querySelectorAll('.tabs-tabs-wrapper').forEach(function(wrapper) {
              var firstBtn = wrapper.querySelector('.tabs-tab-button');
              if (firstBtn) firstBtn.click();
          });
      }
      
      // ========================================================
      // 锚点平滑滚动
      // ========================================================
      document.addEventListener('click', function(e) {
          var link = e.target.closest('a');
          if (link && link.getAttribute('href') && link.getAttribute('href').startsWith('#')) {
              e.preventDefault();
              var id = link.getAttribute('href').slice(1);
              var el = document.getElementById(id);
              if (el) el.scrollIntoView({ behavior: 'smooth' });
          }
      });
    </script>
  </body>
